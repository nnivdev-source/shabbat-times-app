<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0a00">
  <title>נרות שבת | זמני הדלקה ויציאת שבת</title>
  <meta name="description" content="אפליקציית זמני שבת המדויקת ביותר. זמני הדלקת נרות, יציאת שבת, זמנים הלכתיים, פרשת השבוע וברכות להדלקת נרות שבת ויום טוב.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <link rel="manifest" href="/manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        let hasUnregistered = false;
        for(let registration of registrations) {
          registration.unregister();
          hasUnregistered = true;
        }
        if (hasUnregistered) {
          window.location.reload();
        }
      });
    }
  </script>
  <style>
    :root {
      --gold: #c8973a;
      --dark: #0e0600;
      --text: #f0e8d8;
    }
    body {
      background: var(--dark);
      color: var(--text);
      font-family: sans-serif;
      margin: 0;
      direction: rtl;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(14, 6, 0, 0.85);
      backdrop-filter: blur(15px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 3px solid rgba(200, 151, 58, 0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <div style="color: var(--gold); font-weight: 500; letter-spacing: 1px">מעדכן זמנים...</div>
  </div>

  <div class="app">
    <header class="header fade-in" style="position: relative;">
      <!-- Hamburger Menu Button -->
      <button id="btn-menu" class="glass" style="position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; border: none; cursor: pointer; z-index: 100;">
        <div style="width: 20px; height: 2px; background: var(--gold); border-radius: 2px;"></div>
        <div style="width: 20px; height: 2px; background: var(--gold); border-radius: 2px;"></div>
        <div style="width: 20px; height: 2px; background: var(--gold); border-radius: 2px;"></div>
      </button>

      <div class="candle-icon" aria-hidden="true">
        <div class="candle"><div class="flame"></div><div class="candle-body"></div></div>
        <div class="candle"><div class="flame"></div><div class="candle-body"></div></div>
      </div>
      <h1 class="app-title">נרות שבת</h1>
      <p class="app-subtitle">זמני הדלקה ויציאת שבת</p>
    </header>

    <!-- Side Menu Overlay -->
    <div id="side-menu" class="glass fade-in" style="display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(10,10,10,0.95); flex-direction: column; padding: 60px 30px;">
      <button id="close-menu" style="position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--gold); font-size: 2rem; cursor: pointer;">&times;</button>
      <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 40px;">
        <button class="nav-btn active" data-sec="home" style="font-size: 1.5rem; color: var(--text); background: none; border: none; text-align: right; font-weight: 800;">ראשי</button>
        <button class="nav-btn" data-sec="zmanim" style="font-size: 1.5rem; color: var(--text); background: none; border: none; text-align: right; font-weight: 800;">זמנים הלכתיים</button>
        <button class="nav-btn" data-sec="bless" style="font-size: 1.5rem; color: var(--text); background: none; border: none; text-align: right; font-weight: 800;">ברכות השבת</button>
        <button class="nav-btn" data-sec="parasha" style="font-size: 1.5rem; color: var(--text); background: none; border: none; text-align: right; font-weight: 800;">פרשת השבוע</button>
      </div>
    </div>

    <div class="glass location-pill fade-in" id="location-bar">
      <div style="flex: 1; text-align: center;">
        <span class="name" id="loc-name">טוען עיר...</span>
        <span class="badge">שינוי</span>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main id="main-content">
      <!-- HOME SECTION -->
      <section id="sec-home" class="section active fade-in">
        <div class="main-card glass">
          <div class="time-label">הדלקת נרות שבת</div>
          <div class="time-big" id="candle-time">--:--</div>
          <div class="time-date" id="candle-date">טוען...</div>
          <div class="time-hebrew" id="candle-hebrew" style="color: var(--gold); margin-top: 4px; font-weight: 500"></div>
          <div class="countdown" id="countdown">מחשב זמן...</div>
          <div class="action-group">
            <button class="glass action-btn" id="btn-share-main" aria-label="שתפי זמני שבת">
              שתפי זמנים
            </button>
            <button class="glass action-btn" id="btn-notify" aria-label="הפעילי תזכורת">
              התראות
            </button>
          </div>
        </div>

        <div class="card glass">
          <h2 style="font-family: 'Frank Ruhl Libre', serif; color: var(--gold); margin-bottom: 16px; font-size: 1.2rem">זמני השבת</h2>
          <div class="times-grid">
            <div class="time-item">
              <div class="time-item-label">הדלקת נרות</div>
              <div class="time-item-value hl" id="t-candle">--:--</div>
            </div>
            <div class="time-item">
              <div class="time-item-label">שקיעה</div>
              <div class="time-item-value" id="t-sunset">--:--</div>
            </div>
            <div class="time-item">
              <div class="time-item-label">יציאת שבת</div>
              <div class="time-item-value hl" id="t-havdala">--:--</div>
            </div>
            <div class="time-item">
              <div class="time-item-label">צאת הכוכבים</div>
              <div class="time-item-value" id="t-stars">--:--</div>
            </div>
          </div>
        </div>

        <div class="card glass">
          <h2 style="font-family: 'Frank Ruhl Libre', serif; color: var(--gold); margin-bottom: 12px; font-size: 1.1rem">מנהג הדלקה (דקות לפני השקיעה)</h2>
          <div style="margin-bottom: 16px">
            <select id="candle-offset" onchange="window.updateOffset(this.value)">
              <option value="18">18 דקות (סטנדרט עולמי)</option>
              <option value="20">20 דקות (מנהג ארץ ישראל)</option>
              <option value="30">30 דקות (מנהג חב"ד בישראל)</option>
              <option value="40">40 דקות (מנהג ירושלים)</option>
            </select>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
            <button class="btn btn-gold" id="btn-calendar" style="font-size: 0.85rem">הוספי ללוח שנה</button>
            <button class="btn glass" id="btn-locate" style="font-size: 0.85rem">📍 זהי מיקום</button>
          </div>
        </div>
      </section>

      <!-- ZMANIM SECTION -->
      <section id="sec-zmanim" class="section fade-in">
        <div class="card glass">
          <h2 style="font-family: 'Frank Ruhl Libre', serif; color: var(--gold); margin-bottom: 20px; font-size: 1.4rem; text-align: center">זמנים הלכתיים</h2>
          <div id="zmanim-list" class="zmanim-grid">
            <!-- Dynamically populated -->
          </div>
        </div>
      </section>

      <!-- BLESSINGS SECTION -->
      <section id="sec-bless" class="section fade-in">
        <div class="card glass blessing-card">
          <div class="blessing-nav">
            <button class="bless-tab active" data-tab="candles">הדלקת נרות</button>
            <button class="bless-tab" data-tab="kiddush">קידוש</button>
            <button class="bless-tab" data-tab="havdala">הבדלה</button>
            <button class="bless-tab" data-tab="eishet">אשת חיל</button>
          </div>
          <div id="blessing-content" class="blessing-text">
            <!-- Dynamically populated -->
          </div>
        </div>
      </section>

      <!-- PARASHA SECTION -->
      <section id="sec-parasha" class="section fade-in">
        <div class="parasha-card glass">
          <div style="text-align: center; margin-bottom: 30px">
            <h2 id="parasha-name" style="font-size: 2.5rem; color: var(--gold-bright); margin-bottom: 8px">טוען...</h2>
            <div id="parasha-hdate" style="color: var(--gold); letter-spacing: 2px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase"></div>
          </div>
          <div id="parasha-pts" style="margin-bottom: 30px"></div>
          <div id="parasha-pasuk" style="padding: 20px; background: rgba(255,255,255,0.03); border-radius: var(--radius-md); border-right: 4px solid var(--gold); font-family: 'Frank Ruhl Libre', serif; line-height: 1.8; font-size: 1.1rem; color: var(--gold-bright)"></div>
        </div>
      </section>

    </main>
  </div>

  <div id="city-panel" class="glass fade-in" style="display: none; position: fixed; inset: 0; z-index: 200; padding: 40px 16px; background: rgba(0,0,0,0.9); overflow-y: auto">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px">
      <h2 style="color: var(--gold)">בחירת עיר</h2>
      <button id="close-city-panel" class="glass" style="padding: 8px 16px; color: var(--text)">סגור</button>
    </div>
    <input type="text" id="city-search" placeholder="חפשי עיר בישראל או בעולם..." class="glass" style="width: 100%; padding: 16px; color: var(--text); margin-bottom: 20px">
    <div id="city-list" style="display: flex; flex-direction: column; gap: 10px"></div>
  </div>

  <div id="toast" style="position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--dark); padding: 12px 24px; border-radius: 30px; font-weight: 700; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000"></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
